<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Archive — Wardrobe</title>
    <meta
      name="description"
      content="Photograph an outfit, file every piece separately, and see what works together."
    />

    <!-- Android / Chrome install -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EDECEA" />

    <!-- iOS install: Safari ignores the manifest, it needs these -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Archive" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />

    <style>
      html { background: #edecea; }
      body { margin: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
      button { background: none; border: none; padding: 0; font: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
